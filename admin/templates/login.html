<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><script src="https://cdn.tailwindcss.com"></script><title>Admin MotoClube</title></head><body class="min-h-screen bg-zinc-950 text-amber-100 flex items-center justify-center"><form method="post" class="bg-zinc-900 p-8 rounded-2xl max-w-sm w-full border border-amber-700"><h1 class="text-2xl font-bold mb-5">Acesso administrativo</h1><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><input type="password" name="password" required placeholder="Senha" class="p-3 bg-zinc-800 rounded w-full mb-4"><button class="bg-amber-500 text-black p-3 rounded w-full font-bold">Entrar</button>{% for category,message in get_flashed_messages(with_categories=true) %}<p class="mt-3 text-red-400">{{ message }}</p>{% endfor %}</form></body></html>

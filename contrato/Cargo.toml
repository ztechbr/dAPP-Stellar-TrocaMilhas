[package]
name = "motoclube_coin"
version = "0.1.0"
edition = "2021"
[lib]
crate-type = ["cdylib"]
[dependencies]
soroban-sdk = "22.0.0"
[profile.release]
opt-level = "z"
overflow-checks = true
lto = true
codegen-units = 1
panic = "abort"

[dev-dependencies]
soroban-sdk = { version = "22.0.0", features = ["testutils"] }
